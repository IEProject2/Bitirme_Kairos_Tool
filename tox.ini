[tox]
envlist = py311,py312,lint,type,docs
skip_missing_interpreters = True

[testenv]
description = Run unit tests
deps = pytest>=7.0
       pytest-cov>=4.0
extras = dev
commands = pytest {posargs}

[testenv:lint]
description = Run linting checks
skip_install = True
deps = ruff>=0.0.250
commands = ruff check .

[testenv:type]
description = Run type checking
skip_install = False
deps = mypy>=1.0
commands = mypy factory_sim

[testenv:format]
description = Auto-format code
skip_install = True
deps = black>=23.0
commands = black .

[testenv:docs]
description = Build documentation
changedir = docs
deps = sphinx>=5.0
       sphinx-rtd-theme>=1.2
commands = sphinx-build -W -b html -d {envtmpdir}/doctrees . {envtmpdir}/html

[testenv:coverage]
description = Run tests with coverage report
commands = pytest --cov=factory_sim --cov-report=html --cov-report=term-missing
